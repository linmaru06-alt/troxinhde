</button>

                </button>

<script>
        let currentSlide = 1;
        const totalSlides = 3;

        function updateUI() {
            // Update slides visibility
            for (let i = 1; i <= totalSlides; i++) {
                const slide = document.getElementById(`slide-${i}`);
                if (i === currentSlide) {
                    slide.classList.remove('slide-hidden');
                    slide.classList.add('slide-active');
                } else {
                    slide.classList.remove('slide-active');
                    slide.classList.add('slide-hidden');
                }
            }

            // Update dots
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i === currentSlide) {
                    dot.classList.remove('w-2', 'bg-outline-variant');
                    dot.classList.add('w-8', 'bg-primary');
                } else {
                    dot.classList.remove('w-8', 'bg-primary');
                    dot.classList.add('w-2', 'bg-outline-variant');
                }
            }

            // Update buttons
            const btnNext = document.getElementById('btn-next');
            const btnStart = document.getElementById('btn-start');

            if (currentSlide === totalSlides) {
                btnNext.classList.add('hidden');
                btnStart.classList.remove('hidden');
                btnStart.classList.add('flex');
            } else {
                btnNext.classList.remove('hidden');
                btnNext.classList.add('flex');
                btnStart.classList.add('hidden');
                btnStart.classList.remove('flex');
            }
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateUI();
            }
        }

        function skipOnboarding() {
            // Add navigation logic to dashboard
            console.log("Skipped to dashboard");
            alert("Redirecting to Dashboard...");
        }

        function finishOnboarding() {
             // Add navigation logic to create listing page
            console.log("Finished onboarding, go to create listing");
            alert("Redirecting to Create Listing...");
        }
    </script>
