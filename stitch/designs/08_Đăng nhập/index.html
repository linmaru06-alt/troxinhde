<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - TroXinh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dadada",
                        "inverse-primary": "#61de8a",
                        "inverse-surface": "#2f3131",
                        "primary-fixed-dim": "#61de8a",
                        "surface-container": "#eeeeee",
                        "on-secondary": "#ffffff",
                        "primary-container": "#27ae60",
                        "surface": "#f9f9f9",
                        "on-surface": "#1a1c1c",

                        "on-secondary-container": "#713b00",
                        "on-tertiary": "#ffffff",

                        "on-tertiary-container": "#00344f",
                        "on-surface-variant": "#3d4a3f",
                        "on-tertiary-fixed-variant": "#004b6f",
                        "surface-container-highest": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "primary": "#006d37",
                        "secondary": "#904d00",
                        "on-secondary-fixed-variant": "#6e3900",
                        "tertiary-fixed": "#cae6ff",
                        "tertiary-fixed-dim": "#8ccdff",
                        "secondary-container": "#ffa454",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#35a1e0",
                        "on-primary-container": "#00391a",
                        "on-primary-fixed-variant": "#005228",
                        "secondary-fixed-dim": "#ffb77d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "container-max": "1200px",
                        "unit": "8px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "caption": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Be Vietnam Pro"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-md": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-lg overflow-hidden flex flex-col relative z-10">
<!-- Top Decorative Gradient -->
<div class="h-2 w-full bg-gradient-to-r from-primary to-primary-container"></div>
<div class="p-8 sm:p-10 flex flex-col items-center">
<!-- Logo -->
<a class="mb-8 font-headline-lg text-headline-lg text-primary flex items-center gap-2" href="#">
<span class="material-symbols-outlined" data-icon="home_work" style="font-variation-settings: 'FILL' 1;">home_work</span>
                TroXinh
            </a>
<!-- Role Toggle -->
<div class="w-full bg-surface-container-low rounded-xl p-1 mb-8 flex" role="tablist">
<button aria-selected="true" class="flex-1 py-2 px-4 rounded-lg bg-surface-container-lowest text-primary font-label-md text-label-md shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" role="tab">
                    Tôi là người thuê
                </button>
<button aria-selected="false" class="flex-1 py-2 px-4 rounded-lg text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" role="tab">
                    Tôi là chủ trọ
                </button>
</div>
<!-- Header Text -->
<div class="w-full mb-8 text-center sm:text-left">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Đăng nhập</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Chào mừng bạn quay lại với TroXinh</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5">
<!-- Identifier Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="identifier">Số điện thoại hoặc Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md placeholder:text-outline" id="identifier" name="identifier" placeholder="Nhập số điện thoại hoặc email" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Mật khẩu</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="w-full pl-10 pr-10 py-3 rounded-xl border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md placeholder:text-outline" id="password" name="password" placeholder="Nhập mật khẩu" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 rounded border border-outline-variant bg-surface-container-lowest group-hover:border-primary transition-colors">
<input class="peer sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest peer-checked:text-primary transition-colors duration-200 opacity-0 peer-checked:opacity-100 absolute" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary Submit Button -->
<button class="w-full py-3.5 rounded-xl bg-primary-container text-on-primary-container font-label-md text-label-md hover:bg-primary hover:text-on-primary transition-all shadow-sm flex items-center justify-center gap-2 mt-4 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-4 font-caption text-caption text-outline">HOẶC</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full py-3 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Đăng nhập bằng Google
            </button>
<!-- Sign Up Link & Security Note -->
<div class="mt-8 text-center flex flex-col gap-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Chưa có tài khoản? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim hover:underline transition-all" href="#">Đăng ký</a>
</p>
<div class="flex items-center justify-center gap-1.5 text-outline">
<span class="material-symbols-outlined text-[16px]" data-icon="shield_lock">shield_lock</span>
<p class="font-caption text-caption">Thông tin của bạn được bảo mật tuyệt đối</p>
</div>
</div>
</div>
</main>
<!-- Background Illustration Elements (Subtle) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center opacity-30">
<div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed-dim/20 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60vw] h-[60vw] rounded-full bg-secondary-fixed/20 blur-[120px]"></div>
</div>
</body></html>
