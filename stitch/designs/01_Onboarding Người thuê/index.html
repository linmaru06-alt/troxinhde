<style>
        /* Smooth transitions for onboarding steps */
        .step-container {
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        .step-hidden {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateX(100%);
        }
        .step-active {
            opacity: 1;
            pointer-events: auto;
            position: relative;
            transform: translateX(0);
        }
        .step-exit {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transform: translateX(-100%);
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentStep = 1;
            const totalSteps = 3;
            
            const steps = [
                document.getElementById('step-1'),
                document.getElementById('step-2'),
                document.getElementById('step-3')
            ];
            
            const dots = [
                document.getElementById('dot-1'),
                document.getElementById('dot-2'),
                document.getElementById('dot-3')
            ];
            
            const nextBtn = document.getElementById('next-btn');
            const finishBtn = document.getElementById('finish-btn');
            const skipBtn = document.getElementById('skip-btn');

            function updateUI() {
                // Update Steps
                steps.forEach((step, index) => {
                    const stepNum = index + 1;
                    if (stepNum === currentStep) {
                        step.className = 'step-container step-active w-full h-full flex flex-col items-center justify-center px-8 pb-24';
                    } else if (stepNum < currentStep) {
                        step.className = 'step-container step-exit w-full h-full flex flex-col items-center justify-center px-8 pb-24';
                    } else {
                        step.className = 'step-container step-hidden w-full h-full flex flex-col items-center justify-center px-8 pb-24';
                    }
                });

                // Update Dots
                dots.forEach((dot, index) => {
                    if (index + 1 === currentStep) {
                        dot.className = 'h-2 rounded-full bg-accent transition-all duration-300 w-8';
                    } else {
                        dot.className = 'h-2 rounded-full bg-surface-container-high transition-all duration-300 w-2 cursor-pointer hover:bg-surface-variant';
                    }
                });

                // Update Buttons
                if (currentStep === totalSteps) {
                    nextBtn.classList.add('hidden');
                    finishBtn.classList.remove('hidden');
                    skipBtn.classList.add('invisible');
                } else {
                    nextBtn.classList.remove('hidden');
                    finishBtn.classList.add('hidden');
                    skipBtn.classList.remove('invisible');
                }
            }

            nextBtn.addEventListener('click', () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateUI();
                }
            });

            skipBtn.addEventListener('click', () => {
                currentStep = totalSteps;
                updateUI();
            });

            // Optional: Click dots to navigate
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentStep = index + 1;
                    updateUI();
                });
            });
        });
    </script>
