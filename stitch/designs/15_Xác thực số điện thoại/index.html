<script>
        // Minimal OTP Input Logic for UI feel
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].disabled = false;
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                }
            });
        });

        // Simple Timer Simulation
        let timeLeft = 59;
        const timerDisplay = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerHTML = '<button class="text-primary hover:underline focus:outline-none">Gửi lại mã</button>';
            } else {
                timerDisplay.textContent = `Gửi lại (00:${timeLeft < 10 ? '0' : ''}${timeLeft})`;
                timeLeft -= 1;
            }
        }, 1000);
    </script>
