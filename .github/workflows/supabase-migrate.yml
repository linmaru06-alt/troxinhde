name: Deploy Supabase Backend

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Migrations & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID || 'nanhmbnpihlaojbwfebb' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase Credentials
        id: check-creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Supabase CI Notice::SUPABASE_ACCESS_TOKEN chưa được cấu hình trong GitHub Repository Secrets. Bỏ qua bước tự động đồng bộ từ CI. Bạn có thể áp dụng migration trực tiếp trên Supabase SQL Editor."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Supabase CLI
        if: steps.check-creds.outputs.has_token == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        if: steps.check-creds.outputs.has_token == 'true'
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_REF"
          fi

      - name: Push Database Migrations
        if: steps.check-creds.outputs.has_token == 'true'
        run: |
          supabase db push --include-all || echo "::warning::supabase db push skipped or handled"

      - name: Deploy Edge Functions
        if: steps.check-creds.outputs.has_token == 'true'
        run: |
          supabase functions deploy payos-webhook --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy create-payment-link --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy create-momo-payment --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy momo-webhook --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy create-demo-token --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy send-email --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" || true
          supabase functions deploy get-recommendations --project-ref "$SUPABASE_PROJECT_REF" || true

