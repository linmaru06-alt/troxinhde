name: Deploy Supabase Backend

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Migrations & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push Database Migrations
        run: |
          supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy payos-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-payment-link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-momo-payment --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy momo-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-demo-token --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy send-email --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy send-push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy get-recommendations --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
